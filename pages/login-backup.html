<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - امشي صح</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#06140f;
color:white;
}

.container{
width:min(95%,500px);
margin:auto;
padding:30px 15px;
}

.box{
background:#0c241b;
border:1px solid #174c38;
border-radius:18px;
padding:25px;
margin-top:30px;
}

h1,h2{color:#4ade80}

input,button{
width:100%;
padding:14px;
margin-top:12px;
border-radius:10px;
border:1px solid #28634b;
background:#071a13;
color:white;
font-size:16px;
}

button{
background:#176b49;
font-weight:bold;
cursor:pointer;
}

button:hover{background:#21845c}

.secondary{
background:#123528;
}

.message{
margin-top:15px;
padding:10px;
border-radius:8px;
}

.success{color:#4ade80}
.error{color:#f87171}

.hidden{display:none}

a{
color:#4ade80;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>🕌 امشي صح</h1>
<h2>تسجيل الدخول</h2>

<input id="loginEmail" type="email" placeholder="البريد الإلكتروني">

<input id="loginPassword" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<button class="secondary" onclick="showRegister()">
إنشاء حساب جديد
</button>

<div id="loginMessage"></div>

</div>


<div id="registerBox" class="box hidden">

<h2>📝 إنشاء حساب طالب</h2>

<input id="registerName" type="text" placeholder="الاسم الكامل">

<input id="registerPhone" type="text" placeholder="رقم الهاتف">

<input id="registerEmail" type="email" placeholder="البريد الإلكتروني">

<input id="registerPassword" type="password" placeholder="كلمة المرور">

<button onclick="register()">
إنشاء الحساب
</button>

<button class="secondary" onclick="showLogin()">
العودة لتسجيل الدخول
</button>

<div id="registerMessage"></div>

</div>

</div>


<script src="../js/supabase-config.js"></script>


<script>

function headers(){
return {
"apikey": window.AMSHI_SUPABASE.anonKey,
"Authorization": "Bearer " + window.AMSHI_SUPABASE.anonKey,
"Content-Type": "application/json"
};
}


function showRegister(){
document.getElementById("registerBox").classList.remove("hidden");
document.querySelector(".container .box").classList.add("hidden");
}


function showLogin(){
document.getElementById("registerBox").classList.add("hidden");
document.querySelector(".container .box").classList.remove("hidden");
}


async function register(){

const name=document.getElementById("registerName").value.trim();
const phone=document.getElementById("registerPhone").value.trim();
const email=document.getElementById("registerEmail").value.trim();
const password=document.getElementById("registerPassword").value;

const message=document.getElementById("registerMessage");

if(!name || !phone || !email || !password){
message.className="message error";
message.textContent="اكتب جميع البيانات.";
return;
}

if(password.length < 6){
message.className="message error";
message.textContent="كلمة المرور يجب أن تكون 6 أحرف أو أكثر.";
return;
}

try{

const response=await fetch(
window.AMSHI_SUPABASE.url + "/auth/v1/signup",
{
method:"POST",
headers:headers(),
body:JSON.stringify({
email:email,
password:password,
data:{
full_name:name,
phone:phone
}
})
}
);

const data=await response.json();

if(!response.ok){

throw new Error(
data.msg ||
data.message ||
"تعذر إنشاء الحساب"
);

}

message.className="message success";
message.textContent=
"تم إنشاء الحساب بنجاح ✅ راجع بريدك الإلكتروني لتأكيد الحساب، وبعدها انتظر موافقة الإدارة.";

}catch(error){

message.className="message error";
message.textContent=error.message;

}

}


async function login(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

const message=document.getElementById("loginMessage");

if(!email || !password){

message.className="message error";
message.textContent="اكتب البريد الإلكتروني وكلمة المرور.";
return;

}

try{

const response=await fetch(
window.AMSHI_SUPABASE.url + "/auth/v1/token?grant_type=password",
{
method:"POST",
headers:headers(),
body:JSON.stringify({
email:email,
password:password
})
}
);

const data=await response.json();

if(!response.ok){
throw new Error(
data.error_description ||
data.msg ||
"بيانات الدخول غير صحيحة"
);
}

message.className="message success";
message.textContent="تم تسجيل الدخول بنجاح ✅";

localStorage.setItem(
"amshi_sah_access_token",
data.access_token
);

localStorage.setItem(
"amshi_sah_user",
JSON.stringify(data.user)
);

}catch(error){

message.className="message error";
message.textContent=error.message;

}

}

</script>

</body>
</html>
