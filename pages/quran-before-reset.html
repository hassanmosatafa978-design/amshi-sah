function updateSheikhs(){

  const selected = riwaya.value;
  const list = sheikhsByRiwaya[selected] || [];

  sheikh.innerHTML =
    '<option value="">اختر الشيخ</option>';

  list.forEach(function(item){

    const option = document.createElement("option");

    option.value = item[0];
    option.textContent = item[1];

    sheikh.appendChild(option);

  });

  if(list.length === 0){

    const option = document.createElement("option");
    option.value = "";
    option.textContent = "لا توجد تلاوة مربوطة بهذه الرواية حاليًا";
    sheikh.appendChild(option);

  }
}

function normalizeArabic(text){
  return String(text || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u064B-\u065F\u0670]/g, "")
    .replace(/[أإآٱ]/g, "ا")
    .replace(/ة/g, "ه")
    .replace(/ى/g, "ي")
    .replace(/ؤ/g, "و")
    .replace(/ئ/g, "ي")
    .replace(/ـ/g, "")
    .replace(/[^a-z0-9\u0600-\u06FF]/g, "");
}

function levenshtein(a,b){
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));

  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;

  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = Math.min(
        dp[i-1][j]+1,
        dp[i][j-1]+1,
        dp[i-1][j-1] + (a[i-1]===b[j-1] ? 0 : 1)
      );
    }
  }

  return dp[m][n];
}

function smartSurahSearch(value){
  const q = normalizeArabic(value);

  if(!q) return allSurahs;

  return allSurahs
    .map(surah => {

      const name = normalizeArabic(surah.name);
      const english = normalizeArabic(surah.englishName);
      const translation = normalizeArabic(surah.englishNameTranslation);

      let score = 999;

      if(String(surah.number) === q) score = 0;
      else if(name === q) score = 0;
      else if(name.includes(q)) score = 1;
      else if(q.includes(name)) score = 2;
      else {
        const distance = levenshtein(q,name);

        if(distance <= 2) score = 3 + distance;
        else if(q.length >= 4 && distance <= 3) score = 6;
        else if(english.includes(q) || translation.includes(q)) score = 7;
      }

      return {surah,score};
    })
    .filter(x => x.score < 999)
    .sort((a,b) => a.score-b.score)
    .map(x => x.surah);
}

function renderSurahs(list){

  if(!list.length){

    surahList.innerHTML =
      '<div class="loading">لا توجد نتائج.</div>';

    return;
  }

  surahList.innerHTML = "";

  list.forEach(function(surah){

    const div =
      document.createElement("div");

    div.className = "surah";

    div.innerHTML = `
      <span class="surah-number">${surah.number}</span>
      <span class="surah-name">${surah.name}</span>
      <div class="surah-info">
        ${surah.numberOfAyahs ? surah.numberOfAyahs + " آية" : "سورة"}
        ${surah.revelationType ? " • " + (surah.revelationType === "Meccan" ? "مكية" : "مدنية") : ""}
      </div>
    `;

    div.addEventListener("click", function(){

      openSurah(surah.number);

    });

    surahList.appendChild(div);

  });
}

search.addEventListener("input", function(){

  const value = search.value.trim();

  const filtered = smartSurahSearch(value);

  renderSurahs(filtered);

}););

async function openSurah(number){

  quranBox.style.display = "block";

  surahList.style.display = "none";
  search.style.display = "block";

  quranTitle.textContent =
    "جاري تحميل السورة...";

  ayahs.innerHTML =
    '<div class="loading">جاري تحميل القرآن...</div>';

  notice.innerHTML = "";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  try{

    const textResponse =
      await fetch(
        API + "/surah/" + number + "/quran-uthmani"
      );

    const textJson =
      await textResponse.json();

    const surah =
      textJson.data;

    quranTitle.textContent =
      surah.name;

    ayahs.innerHTML = "";

    surah.ayahs.forEach(function(ayah){

      const div =
        document.createElement("div");

      div.className = "ayah";

      div.innerHTML =
        `${ayah.text}
         <span class="ayah-number">
           ﴿${ayah.numberInSurah}﴾
         </span>`;

      ayahs.appendChild(div);

    });

    setAudio(number);

  }catch(error){

    ayahs.innerHTML =
      '<div class="loading">حدث خطأ أثناء تحميل السورة.</div>';

  }

}

function setAudio(number){

  const selectedRiwaya =
    riwaya.value;

  const selectedSheikh =
    sheikh.value;

  notice.innerHTML = "";

  if(!selectedSheikh){

    audioPlayer.removeAttribute("src");
    audioPlayer.load();

    notice.innerHTML =
      "اختار الشيخ أولًا لتشغيل التلاوة.";

    return;
  }

  /*
    الصوت الحالي يأتي من إصدار التلاوة المختار.
    الروايات التي ليس لها ملف صوت مربوط لن تشغل صوتًا
    حتى لا ننسب تلاوة لرواية غير صحيحة.
  */

  const audioSupportedRiwaya = {
    "hafs": true,
    "warsh": true,
    "qaloon": true,
    "duri": true,
    "susi": true,
    "shubah": true
  };

  if(!audioSupportedRiwaya[selectedRiwaya]){

    audioPlayer.removeAttribute("src");
    audioPlayer.load();

    notice.innerHTML =
      "الرواية المختارة موجودة في واجهة التطبيق، لكن لم نربط مصدر تلاوة موثوق لها بعد.";

    return;
  }

  /*
    Al Quran Cloud CDN
    الصوت يكون حسب رقم السورة والقارئ.
  */

  const url =
    "https://cdn.islamic.network/quran/audio-surah/128/"
    + selectedSheikh
    + "/"
    + number
    + ".mp3";

  audioPlayer.src = url;
  audioPlayer.load();

}

sheikh.addEventListener("change", function(){

  const visible =
    quranBox.style.display === "block";

  if(visible){

    const title =
      quranTitle.textContent;

    const found =
      allSurahs.find(function(s){
        return s.name === title;
      });

    if(found){
      setAudio(found.number);
    }

  }

});

function closeQuran(){

  audioPlayer.pause();
  audioPlayer.removeAttribute("src");
  audioPlayer.load();

  quranBox.style.display = "none";
  surahList.style.display = "grid";
  search.style.display = "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}
